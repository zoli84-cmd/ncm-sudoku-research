[project]
name = "ncm-sudoku"
version = "0.1.0"
description = "Sudoku tooling and NCM instrumentation for the NCM-Sudoku research project"
authors = [
    { name = "zoli84-cmd", email = "286415252+zoli84-cmd@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "omegaconf>=2.3.1",
    "psutil>=7.2.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pymupdf>=2.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["slow: real-data checks that take longer"]
addopts = "-m 'not slow'"
